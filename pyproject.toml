[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactcam"
version = "0.2.0"
description = "Tracked face, licence-plate, occupant and person redaction for video, with an independent coverage verifier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "backroadcreativeco@gmail.com" }]
keywords = ["privacy", "redaction", "anonymisation", "blur", "video", "gdpr", "yolo", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
# onnxruntime is deliberately NOT a base dependency: the CPU (``onnxruntime``)
# and CUDA (``onnxruntime-gpu``) wheels both own the ``onnxruntime/`` package
# directory and the last one installed wins. A base dependency on either lets a
# later ``pip install`` of this package silently replace the other — which is how
# a GPU pipeline venv ended up running its blur pass on CPU for a day
# (2026-09-25). Pick exactly one runtime extra: ``redactcam[cpu]`` or
# ``redactcam[gpu]``.
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# CenterFace fallback for when no YOLO face model is configured. Optional
# because it is a large dependency and a measurably weaker detector; the
# library raises rather than silently detecting nothing when neither is present.
centerface = ["deface>=1.5.0"]
# Exactly one of these. ``cpu`` is the portable build; ``gpu`` is the CUDA build
# (the detectors then REQUIRE CUDAExecutionProvider and raise
# GpuProviderUnavailableError if it is missing — REDACTCAM_ALLOW_CPU=1 overrides).
# Switching from one to the other: ``pip uninstall -y onnxruntime`` then
# ``pip install --force-reinstall --no-deps onnxruntime-gpu==<ver>`` — a plain
# install sees the still-satisfied metadata and rewrites nothing.
cpu = ["onnxruntime>=1.16.0"]
gpu = ["onnxruntime-gpu>=1.16.0"]
dev = [
    "onnxruntime>=1.16.0",
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
redactcam = "redactcam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["redactcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are mostly prose in docstrings
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
