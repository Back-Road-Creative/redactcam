[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactcam"
version = "0.1.1"
description = "Tracked face, licence-plate, occupant and person redaction for video, with an independent coverage verifier."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joe Petrucelli", email = "backroadcreativeco@gmail.com" }]
keywords = ["privacy", "redaction", "anonymisation", "blur", "video", "gdpr", "yolo", "onnx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
# CenterFace fallback for when no YOLO face model is configured. Optional
# because it is a large dependency and a measurably weaker detector; the
# library raises rather than silently detecting nothing when neither is present.
centerface = ["deface>=1.5.0"]
# Swap onnxruntime for the CUDA build. Install with --no-deps or uninstall
# onnxruntime first; the two distributions conflict.
gpu = ["onnxruntime-gpu>=1.16.0"]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
redactcam = "redactcam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["redactcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines are mostly prose in docstrings
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
