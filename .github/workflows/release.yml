name: Release

# Pushing a v* tag builds the Windows installer and attaches it to that tag's
# GitHub release, creating the release if it does not exist yet.
#
# workflow_dispatch runs the identical build and stops short of publishing,
# leaving the installer as a build artifact instead. Every Windows-only step --
# the PyInstaller freeze, the ISCC compile, the Inno install -- is unrunnable
# anywhere outside this runner, so without a dry run the first proof that any of
# it works would be a public release that might already be broken.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (must match pyproject.toml)"
        required: true

permissions:
  contents: write # gh release create / upload

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Take the version from the tag, or from the dispatch input
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $v = $env:DISPATCH_VERSION
          } else {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Refuse a tag that disagrees with pyproject.toml
        # Otherwise the installer would announce a version the packaged code
        # does not claim, and Add/Remove Programs would carry that number for
        # as long as it stays installed.
        run: |
          $packaged = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($packaged -ne $env:VERSION) {
            throw "tag $env:GITHUB_REF_NAME means version $env:VERSION, pyproject.toml says $packaged"
          }

      - name: Install redactcam and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.21.0

      - name: Build the one-file executable
        # redactcam's entry point is a module function, so PyInstaller is aimed
        # at installer/redactcam_launcher.py. Capital PyInstaller is
        # load-bearing: `python -m pyinstaller` is not a module and fails.
        #
        # No --hidden-import: onnxruntime, opencv and numpy are all resolved by
        # PyInstaller's bundled hooks, verified by freezing and running a full
        # detect-track-mask-verify pass. Weights are never frozen in - they are
        # fetched at run time, which is also what keeps this exe under 100 MB.
        run: python -m PyInstaller --onefile --console --name redactcam installer/redactcam_launcher.py

      - name: Smoke-test the frozen executable
        run: dist\redactcam.exe --help

      - name: Install Inno Setup
        # Installed, not assumed: a runner image that quietly drops a
        # preinstalled tool would break releases with no warning.
        run: choco install innosetup -y --no-progress --version=6.7.1

      - name: Build the installer
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc - Inno Setup's install layout changed" }
          & $iscc /DAppVersion=$env:VERSION installer\redactcam.iss

      - name: Checksum the installer
        # A binary nobody can verify is a binary nobody should trust. The hash is
        # written beside the exe, shipped as a release asset, and repeated in the
        # release notes so a download can be checked without fetching the asset.
        run: |
          $exe = "dist\redactcam-setup-$env:VERSION.exe"
          if (-not (Test-Path $exe)) { throw "no installer at $exe" }
          $leaf = Split-Path $exe -Leaf
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $leaf" | Out-File -FilePath dist\SHA256SUMS -Encoding ascii
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Keep the installer as an artifact (dry run only)
        # A dry run proves the build; it deliberately publishes nothing.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redactcam-setup-${{ env.VERSION }}
          path: |
            dist/redactcam-setup-${{ env.VERSION }}.exe
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'push'
        # gh ships on the runner, so this needs no third-party action to pin,
        # audit and keep current — softprops/action-gh-release would buy only
        # the create-if-missing branch written out below.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = "dist\redactcam-setup-$env:VERSION.exe"
          $leaf = Split-Path $exe -Leaf
          # Notes are rebuilt from scratch every run, so re-running a release cannot
          # append a second checksum block to notes that already carry one.
          $generated = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f tag_name=$env:GITHUB_REF_NAME -q .body
          if ($LASTEXITCODE -ne 0) { throw "could not generate release notes for $env:GITHUB_REF_NAME" }
          $notes = "dist\release-notes.md"
          @(
            $generated
            ""
            "## Verify the download"
            ""
            '```'
            "$env:INSTALLER_SHA256  $leaf"
            '```'
          ) | Set-Content -Path $notes -Encoding utf8
          gh release view $env:GITHUB_REF_NAME --json tagName | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $exe dist\SHA256SUMS --clobber
            if ($LASTEXITCODE -ne 0) { throw "could not upload $exe to $env:GITHUB_REF_NAME" }
            gh release edit $env:GITHUB_REF_NAME --notes-file $notes
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --notes-file $notes $exe dist\SHA256SUMS
          }
          if ($LASTEXITCODE -ne 0) { throw "could not publish $exe to $env:GITHUB_REF_NAME" }
